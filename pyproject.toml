[project]
name = "votify"
version = "1.9.9"
description = "A command-line app for downloading songs, podcasts and videos from Spotify."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "async-lru>=2.1.0",
    "click>=8.3.1",
    "colorama>=0.4.6",
    "dataclass-click>=1.0.4",
    "httpx>=0.28.1",
    "httpx-retries>=0.4.6",
    "inquirerpy>=0.3.4",
    "mutagen>=1.47.0",
    "pillow>=12.1.0",
    "pybase62>=1.0.0",
    "pycryptodome>=3.23.0",
    "pywidevine>=1.9.0",
    "unplayplay>=0.0.2",
    "yt-dlp>=2026.2.4",
]

[project.urls]
repository = "https://github.com/glomatico/votify"

[project.scripts]
votify = "votify.cli.cli:main"

[project.optional-dependencies]
librespot = [
    # PyPI librespot 0.0.1 uses Spotify's retired keymaster token endpoint
    # (HTTP 403 since 2025-08) and 0.0.10 pins protobuf==3.20.1, which
    # conflicts with pywidevine's protobuf>=6.33,<7. This branch is 0.0.10
    # (Login5 tokens) with protobuf stubs regenerated for protobuf>=4.25.1,<7.
    "librespot @ git+https://github.com/JavaGT/librespot-python@protobuf-6-compat",
]
dev = [
    "asynctest>=0.13.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
]
